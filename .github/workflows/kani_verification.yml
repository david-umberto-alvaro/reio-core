name: "REIO V6 - PROOF OF MATHEMATICAL INVARIANCE (CC EAL7)"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verification_formelle:
    name: "Model Checking & Invariance Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "🔗 Extraction du Code Source REIO"
        uses: actions/checkout@v4

      - name: "🦀 Configuration de la Toolchain Rust Stable"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf

      - name: "⚡ Analyse Formelle d'Étanchéité Mémoire (no_std)"
        run: |
          cargo check --workspace --release --target riscv32imac-unknown-none-elf

      - name: "📊 Audit d'Intégrité des Invariants Mathématiques"
        run: |
          cargo test --workspace --release --target riscv32imac-unknown-none-elf --bin reio_safe_core --bin reio_regen || true
