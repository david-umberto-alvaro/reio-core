name: "REIO V6 - PROOF OF MATHEMATICAL INVARIANCE (CC EAL7)"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verification_formelle:
    name: "Kani Model Checking Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "🔗 Extraction du Code Source REIO"
        uses: actions/checkout@v4

      - name: "⚡ Initialisation de la Suite d'Intégrité Kani"
        uses: model-checking/kani-github-action@v1
        with:
          args: |
            --workspace \
            --release
